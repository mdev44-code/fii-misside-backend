[tool.poetry]
name = "asso-backend"
version = "0.1.0"
description = "API de gestion d'association villageoise"
authors = ["Ton Nom <ton@email.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"

# ── Framework web ──────────────────────────────────────────────────────────────
# FastAPI : notre framework principal pour créer l'API REST
# uvicorn : le serveur qui fait tourner FastAPI (comme Apache pour PHP)
fastapi = "^0.136.1"
uvicorn = { extras = ["standard"], version = "^0.46.0" }

# ── Base de données ────────────────────────────────────────────────────────────
# SQLAlchemy : l'ORM — permet d'écrire des requêtes en Python au lieu de SQL brut
# alembic : gère les migrations (modifications de structure de la BDD)
# asyncpg : driver PostgreSQL pour les requêtes asynchrones (plus rapide)
# psycopg2-binary : driver PostgreSQL synchrone, utilisé par Alembic uniquement
sqlalchemy = { extras = ["asyncio"], version = "^2.0.49" }
alembic = "^1.18.4"
asyncpg = "^0.31.0"
psycopg2-binary = "^2.9.12"

# ── Validation des données ─────────────────────────────────────────────────────
# pydantic : valide automatiquement les données reçues dans les requêtes
# pydantic-settings : lit les variables d'environnement (.env) avec validation
# email-validator : valide le format des emails
pydantic = "^2.13.4"
pydantic-settings = "^2.14.1"
email-validator = "^2.3.0"

# ── Sécurité ──────────────────────────────────────────────────────────────────
# pyjwt : génère et vérifie les tokens JWT (recommandé par FastAPI docs)
# pwdlib[argon2] : hash les mots de passe avec Argon2 (algorithme recommandé OWASP)
#                  remplace passlib qui n'est plus maintenu
# python-multipart : permet de recevoir des formulaires (requis par FastAPI)
pyjwt = "^2.12.1"
argon2-cffi = "^25.1.0"
python-multipart = "^0.0.28"

# ── Cache ─────────────────────────────────────────────────────────────────────
# redis : connexion au serveur Redis pour stocker les sessions et tokens
redis = { extras = ["asyncio"], version = "^7.4.0" }

# ── Cron jobs ─────────────────────────────────────────────────────────────────
# apscheduler v3.x : planifie des tâches automatiques — épinglé <4.0.0 car v4 incompatible
apscheduler = ">=3.11.2,<4.0.0"

# ── Notifications SMS ─────────────────────────────────────────────────────────
africastalking = "^2.0.2"

# HTTP client (utilisé en prod pour le healthcheck)
httpx = "^0.28.1"

# ── Utilitaires ───────────────────────────────────────────────────────────────
python-dateutil = "^2.9.0"
pytz = "^2026.2"
boto3 = "^1.43.6"

[tool.poetry.group.dev.dependencies]
# Outils de développement uniquement (pas installés en production)
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.1.0"
httpx = "^0.28.1"       # client HTTP pour tester les routes FastAPI
ruff = "^0.15.12"       # linter + formateur de code (remplace flake8 + black)
mypy = "^2.1.0"         # vérification des types Python

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ── Configuration de Ruff (linter) ────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100       # longueur max d'une ligne

[tool.ruff.lint]
# E/W = erreurs style, F = erreurs logiques, I = ordre imports, N = nommage
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]       # ignore les lignes trop longues (géré par line-length)

# ── Configuration de Pytest ────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"   # tous les tests async sans décorateur supplémentaire
testpaths = ["tests"]